-d:release
--opt:speed
--app:lib
--cpu:amd64
--threads:on
--mm:arc
--hints:off

@if windows:
  --out:"pymew.pyd"
  --tlsEmulation:off
  --passC:"-fvisibility=hidden"
  # GCC < 15 fix on Windows
  --passC:"-include raylib.h"
  --passL:"-static-libgcc"
@elif linux:
  --out:"pymew.so"
  --passC:"-fvisibility=hidden -Wno-int-conversion"
@end